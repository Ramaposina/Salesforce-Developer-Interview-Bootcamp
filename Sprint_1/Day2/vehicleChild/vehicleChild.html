<template>

    <lightning-card title="Child Component">

        <div class="slds-p-around_medium">

            <template if:true={vehicle}>

                <p>

                    <strong>Customer Name :</strong>

                    {vehicle.Customer_Name__c}

                </p>

                <p>

                    <strong>Vehicle Number :</strong>

                    {vehicle.Vehicle_Number__c}

                </p>

            </template>

            <br/>

            <lightning-button
                label="Notify Parent"
                onclick={sendMessage}>
            </lightning-button>

        </div>

    </lightning-card>

</template>
