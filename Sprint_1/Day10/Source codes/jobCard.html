<template>

    <lightning-card>

        <div class="slds-p-around_medium">

            <h2 class="slds-text-heading_medium">
                {job.Company__c}
            </h2>

            <p class="slds-m-top_small">
                <strong>Role:</strong> {job.Role__c}
            </p>

            <p>
                <strong>Package:</strong> {job.Package__c}
            </p>

            <p>
                <strong>Location:</strong> {job.Location__c}
            </p>

            <p>
                <strong>Deadline:</strong> {job.Deadline__c}
            </p>

            <div class="slds-m-top_medium">

                <lightning-button
                    variant="brand"
                    label={buttonLabel}
                    disabled={isProcessing}
                    data-job-id={job.Id}
                    onclick={handleApply}>
                </lightning-button>

            </div>

            <!-- Processing -->
            <template if:true={isProcessing}>
                <div class="slds-m-top_small">
                    <lightning-spinner
                        alternative-text="Submitting application"
                        size="small">
                    </lightning-spinner>

                    <p class="slds-m-top_small">
                        Submitting your application...
                    </p>
                </div>
            </template>

            <!-- Success -->
            <template if:true={isSubmitted}>
                <div class="slds-text-color_success slds-m-top_small">
                    ✓ Application submitted successfully.
                </div>
            </template>

            <!-- Error -->
            <template if:true={errorMessage}>
                <div class="slds-text-color_error slds-m-top_small">
                    {errorMessage}
                </div>
            </template>

        </div>

    </lightning-card>

</template>
